services:
  # ----------------------------------------------------------------------------
  # 1. Main PostgreSQL Database (Dữ liệu nghiệp vụ tin tức)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tech-news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_news_db}
      POSTGRES_USER: ${POSTGRES_USER:-tech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_summary}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tech_admin} -d $${POSTGRES_DB:-tech_news_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 2. Backend Service (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: ai-tech-news-backend:local
    container_name: tech-news-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tech_admin}:${POSTGRES_PASSWORD:-news_summary}@postgres:5432/${POSTGRES_DB:-tech_news_db}
    ports:
      - "${BACKEND_PORT:-18080}:8000"
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 3. Frontend Service (Next.js)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    image: ai-tech-news-frontend:local
    container_name: tech-news-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-18080}
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 4. Airflow Metadata Database
  # ----------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16-alpine
    container_name: tech-news-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AIRFLOW_POSTGRES_USER:-airflow} -d $${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 5. Airflow Init Service (Chạy migration & tạo admin user)
  # ----------------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: ai-tech-news-airflow:local
    container_name: tech-news-airflow-init
    restart: "no"
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-4686e72d25d79464b87638401f341eb2}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tech_admin}:${POSTGRES_PASSWORD:-news_summary}@postgres:5432/${POSTGRES_DB:-tech_news_db}
      CRAWL_URLS: ${CRAWL_URLS:-}
      CRAWL_SOURCE_ID: ${CRAWL_SOURCE_ID:-1}
      CRAWL_SOURCE_NAME: ${CRAWL_SOURCE_NAME:-vnexpress}
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-20}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PYTHONPATH: /opt/project:/opt/project/scripts
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./database:/opt/project/database:ro
      - ./scripts:/opt/project/scripts:ro
      - ./crawl_data:/opt/project/crawl_data
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create
      --username \"$${AIRFLOW_ADMIN_USERNAME:-admin}\"
      --password \"$${AIRFLOW_ADMIN_PASSWORD:-admin}\"
      --firstname Admin
      --lastname User
      --role Admin
      --email \"$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}\" || true)"
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 6. Airflow Webserver (UI điều khiển crawler & theo dõi DAGs)
  # ----------------------------------------------------------------------------
  airflow-webserver:
    image: ai-tech-news-airflow:local
    container_name: tech-news-airflow-webserver
    restart: unless-stopped
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_PORT:-18088}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    networks:
      - tech_news_network

  # ----------------------------------------------------------------------------
  # 7. Airflow Scheduler (Lập lịch & điều phối pipeline crawler)
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    image: ai-tech-news-airflow:local
    container_name: tech-news-airflow-scheduler
    restart: unless-stopped
    environment: *airflow-environment
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    networks:
      - tech_news_network

networks:
  tech_news_network:
    name: tech_news_network
    driver: bridge

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
